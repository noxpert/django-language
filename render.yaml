services:
  - type: web
    name: django-language
    env: docker
    region: oregon
    plan: starter
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    buildCommand: python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    envVars:
      - key: DJANGO_SECRET_KEY
        value: change-me
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DB_NAME
        value: django_language
      - key: DB_USER
        value: change-me
      - key: DB_PASSWORD
        value: change-me
      - key: DB_HOST
        value: change-me
      - key: DB_PORT
        value: "5432"
